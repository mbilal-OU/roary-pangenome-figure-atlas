name: Build Roary figure atlas

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install figure dependencies
        run: python -m pip install -r requirements.txt
      - name: Verify representative-panel figure pipeline
        run: python -m unittest discover -s tests -v
